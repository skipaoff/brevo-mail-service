services:
  mail:
    build: .
    env_file: .env
    # Наружу не публикуем: бэкенд ходит к сервису по внутренней сети
    # (http://mail:8080). Для локальной проверки можно открыть порт на 127.0.0.1.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
