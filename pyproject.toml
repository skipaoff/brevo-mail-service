[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brevo-mail-service"
version = "1.1.0"
description = "Transactional email via Brevo: verification codes, password reset, notices, delivery log"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mailservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
